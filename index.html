<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#c2302e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Кольца — водная игра</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#c2302e;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
  canvas{display:block;touch-action:none}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;background:rgba(10,20,40,.62);text-align:center;padding:24px;box-sizing:border-box}
  .hidden{display:none!important}
  h1{margin:0;font-size:40px;letter-spacing:1px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
  p{margin:0;max-width:340px;line-height:1.4;opacity:.92}
  .sub{opacity:.75;margin-bottom:6px}
  .small{font-size:13px;opacity:.75;min-height:16px}
  button{font:inherit;font-size:19px;font-weight:700;color:#fff;border:0;border-radius:16px;padding:14px 22px;
    min-width:250px;background:linear-gradient(#3b8cff,#1a5fd0);box-shadow:0 5px 0 #0d3a85;cursor:pointer}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #0d3a85}
  button.alt{background:linear-gradient(#ff6b8a,#d8264d);box-shadow:0 5px 0 #8a0d27}
  button.green{background:linear-gradient(#3fd68f,#16a35f);box-shadow:0 5px 0 #0b6b3c}
  button.ghost{background:rgba(255,255,255,.14);box-shadow:none}
  #pauseBtn{position:fixed;top:8px;right:8px;min-width:0;width:44px;height:44px;padding:0;font-size:16px;
    border-radius:12px;background:rgba(0,0,0,.22);box-shadow:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="pauseBtn" class="hidden" aria-label="Пауза">II</button>

<div id="menu" class="overlay">
  <h1>Кольца</h1>
  <p class="sub">Водная игра из детства</p>
  <p>Жми на левую или правую половину экрана. Чем выше касание — тем сильнее струя. Резкий свайп вверх — сильный толчок. Насос выдыхается: отпусти, чтобы он снова набрал воду.</p>
  <div style="height:6px"></div>
  <button data-mode="classic">Классика</button><div class="small" id="best-classic"></div>
  <button data-mode="colors" class="alt">Два цвета</button><div class="small" id="best-colors"></div>
  <button data-mode="waves" class="green">Волны</button><div class="small" id="best-waves"></div>
  <p class="small">На компьютере: A / L или стрелки, с Shift — сильнее</p>
</div>

<div id="pause" class="overlay hidden">
  <h1>Пауза</h1>
  <button id="resumeBtn">Продолжить</button>
  <button id="restartBtn" class="ghost">Заново</button>
  <button class="ghost toMenu">В меню</button>
</div>

<div id="result" class="overlay hidden">
  <h1 id="resTitle"></h1>
  <p id="resText"></p>
  <p class="small" id="resBest"></p>
  <div style="height:6px"></div>
  <button id="againBtn">Ещё раз</button>
  <button class="ghost toMenu">В меню</button>
</div>

<script>
'use strict';

// ---------- Мир ----------
const W = 360, H = 648, CELL = 12, NX = W / CELL, NY = H / CELL, SX = NX + 2, NCELLS = (NX + 2) * (NY + 2);
const RIM = 5, RING_D = 34, PEG_R = 3.5, G = 220, K_PAR = 1.6, K_PERP = 5.5, MAXV = 800;
const JET = 620, JET_LEN = 340, JET_W0 = 34, JET_SPREAD = 0.24, DRAIN = 1.1, REFILL = 1.3, VORT = 5, FLUID_DAMP = 0.6;
// Надетое кольцо трётся о штырь и частично прикрыто им от потока — чтобы его не сдувало каждым нажатием
const PEG_SHELTER = 0.7, PEG_FRICTION = 3;
// Видимое кувыркание кольца вокруг своей оси: phi — угол наклона к зрителю
// Тонущее плоское кольцо стремится лечь горизонтально (главный рычаг сложности)
const ALIGN = 20;
const SPIN_REST = 0.35, SPIN_K = 0.06, SPIN_MAX = 14, SUCTION = 140;
const STEP = 1 / 60, SUB = 2;
const PEG_TIP = 330, PEG_BOTTOM = H - 150;
// Дно-горка как у игрушки: кольца скатываются к соплам
const FLOOR = [[0, H - 60], [62, H - 6], [180, H - 48], [298, H - 6], [360, H - 60]];
const floorY = x => {
  for (let i = 1; i < FLOOR.length; i++) {
    const [x0, y0] = FLOOR[i - 1], [x1, y1] = FLOOR[i];
    if (x <= x1) return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
  }
  return H;
};
const pegs = [{ x: 120, tip: PEG_TIP, bottom: PEG_BOTTOM }, { x: 240, tip: PEG_TIP, bottom: PEG_BOTTOM }];
const nozzles = [mkNozzle(66, H - 6, 0.3), mkNozzle(W - 66, H - 6, -0.3)];
const PALETTE = ['#ff4d6d', '#ffd23f', '#3ddc97', '#4cc9f0', '#b388ff', '#ff9f1c', '#f15bb5', '#9ef01a'];
const DUO = ['#ff3b5c', '#2f7dff'];

function mkNozzle(x, y, dx) { const l = Math.hypot(dx, 1); return { x, y, dx: dx / l, dy: -1 / l }; }
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  return `rgb(${((n >> 16) & 255) * f | 0},${((n >> 8) & 255) * f | 0},${(n & 255) * f | 0})`;
}
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;

// ---------- Жидкость (stable fluids, сетка NX x NY) ----------
const IX = (i, j) => i + SX * j;
const u = new Float64Array(NCELLS), v = new Float64Array(NCELLS);
const u0 = new Float64Array(NCELLS), v0 = new Float64Array(NCELLS);
const pr = new Float64Array(NCELLS), dv = new Float64Array(NCELLS), curl = new Float64Array(NCELLS);

function setBnd(b, x) {
  for (let j = 1; j <= NY; j++) {
    x[IX(0, j)] = b === 1 ? -x[IX(1, j)] : x[IX(1, j)];
    x[IX(NX + 1, j)] = b === 1 ? -x[IX(NX, j)] : x[IX(NX, j)];
  }
  for (let i = 1; i <= NX; i++) {
    x[IX(i, 0)] = b === 2 ? -x[IX(i, 1)] : x[IX(i, 1)];
    x[IX(i, NY + 1)] = b === 2 ? -x[IX(i, NY)] : x[IX(i, NY)];
  }
  x[IX(0, 0)] = 0.5 * (x[IX(1, 0)] + x[IX(0, 1)]);
  x[IX(0, NY + 1)] = 0.5 * (x[IX(1, NY + 1)] + x[IX(0, NY)]);
  x[IX(NX + 1, 0)] = 0.5 * (x[IX(NX, 0)] + x[IX(NX + 1, 1)]);
  x[IX(NX + 1, NY + 1)] = 0.5 * (x[IX(NX, NY + 1)] + x[IX(NX + 1, NY)]);
}

// Давление не обнуляем между шагами — старт с прошлого решения сходится быстрее
function project() {
  for (let j = 1; j <= NY; j++) for (let i = 1, k = j * SX + 1; i <= NX; i++, k++) {
    dv[k] = -0.5 * (u[k + 1] - u[k - 1] + v[k + SX] - v[k - SX]);
  }
  setBnd(0, dv);
  for (let it = 0; it < 20; it++) {
    for (let j = 1; j <= NY; j++) for (let i = 1, k = j * SX + 1; i <= NX; i++, k++) {
      pr[k] = (dv[k] + pr[k - 1] + pr[k + 1] + pr[k - SX] + pr[k + SX]) * 0.25;
    }
    setBnd(0, pr);
  }
  for (let j = 1; j <= NY; j++) for (let i = 1; i <= NX; i++) {
    const k = IX(i, j);
    u[k] -= 0.5 * (pr[k + 1] - pr[k - 1]);
    v[k] -= 0.5 * (pr[k + SX] - pr[k - SX]);
  }
  setBnd(1, u); setBnd(2, v);
}

function advect(b, d, d0, uu, vv, dt) {
  const dt0 = dt / CELL;
  for (let j = 1; j <= NY; j++) for (let i = 1; i <= NX; i++) {
    const k = IX(i, j);
    const x = clamp(i - dt0 * uu[k], 0.5, NX + 0.5), y = clamp(j - dt0 * vv[k], 0.5, NY + 0.5);
    const i0 = x | 0, j0 = y | 0, s1 = x - i0, s0 = 1 - s1, t1 = y - j0, t0 = 1 - t1;
    d[k] = s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j0 + 1)]) + s1 * (t0 * d0[IX(i0 + 1, j0)] + t1 * d0[IX(i0 + 1, j0 + 1)]);
  }
  setBnd(b, d);
}

function vorticity(dt) {
  for (let j = 1; j <= NY; j++) for (let i = 1; i <= NX; i++) {
    const k = IX(i, j);
    curl[k] = 0.5 * ((v[k + 1] - v[k - 1]) - (u[k + SX] - u[k - SX]));
  }
  for (let j = 2; j < NY; j++) for (let i = 2; i < NX; i++) {
    const k = IX(i, j);
    let nx = 0.5 * (Math.abs(curl[k + 1]) - Math.abs(curl[k - 1]));
    let ny = 0.5 * (Math.abs(curl[k + SX]) - Math.abs(curl[k - SX]));
    const len = Math.hypot(nx, ny) + 1e-5;
    nx /= len; ny /= len;
    u[k] += VORT * dt * ny * curl[k];
    v[k] -= VORT * dt * nx * curl[k];
  }
}

function fluidStep(dt) {
  vorticity(dt);
  const damp = Math.exp(-FLUID_DAMP * dt);
  for (let k = 0; k < NCELLS; k++) { u[k] *= damp; v[k] *= damp; }
  u0.set(u); v0.set(v);
  advect(1, u, u0, u0, v0, dt);
  advect(2, v, v0, u0, v0, dt);
  project();
}

function resetFluid() { u.fill(0); v.fill(0); pr.fill(0); }

function sample(f, x, y) {
  const gx = clamp(x / CELL + 0.5, 0.5, NX + 0.5), gy = clamp(y / CELL + 0.5, 0.5, NY + 0.5);
  const i0 = gx | 0, j0 = gy | 0, s = gx - i0, t = gy - j0;
  return (1 - s) * ((1 - t) * f[IX(i0, j0)] + t * f[IX(i0, j0 + 1)]) + s * ((1 - t) * f[IX(i0 + 1, j0)] + t * f[IX(i0 + 1, j0 + 1)]);
}

// ---------- Насосы ----------
function makePump() { return { held: false, id: null, y: 0, lastY: 0, lastT: 0, base: 0, boost: 0, flow: 0, stroke: 1, emit: 0, auto: 0 }; }
const pumps = [makePump(), makePump()];

function updatePump(p, dt) {
  if (p.auto > 0) { p.auto -= dt; if (p.auto <= 0) p.held = false; }
  const target = p.held && p.stroke > 0.001 ? Math.min(1, p.base + p.boost) : 0;
  const k = target > p.flow ? 28 : 9;
  p.flow += (target - p.flow) * (1 - Math.exp(-k * dt));
  if (p.held) p.stroke = Math.max(0, p.stroke - p.flow * DRAIN * dt);
  else p.stroke = Math.min(1, p.stroke + REFILL * dt);
  p.boost *= Math.exp(-3 * dt);
}

// Струя — конус длиной JET_LEN: вода разгоняется вдоль всей его оси, а не только у сопла.
function inject(side) {
  const p = pumps[side];
  if (!p.held && p.stroke < 1) suck(side, (1 - p.stroke));
  if (p.flow < 0.01) return;
  const n = nozzles[side], sp = p.flow * JET, len = JET_LEN * (0.5 + 0.5 * p.flow);
  const mx = n.x + n.dx * 8, my = n.y + n.dy * 8;
  const reach = len + 40;
  const i0 = Math.max(1, Math.floor((mx - reach) / CELL) + 1), i1 = Math.min(NX, Math.floor((mx + reach) / CELL) + 1);
  const j0 = Math.max(1, Math.floor((my - reach) / CELL) + 1), j1 = Math.min(NY, Math.floor((my + 20) / CELL) + 1);
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const rx = (i - 0.5) * CELL - mx, ry = (j - 0.5) * CELL - my;
    const along = rx * n.dx + ry * n.dy;
    if (along < -CELL || along > len) continue;
    const perp = Math.abs(rx * n.dy - ry * n.dx), width = JET_W0 + Math.max(0, along) * JET_SPREAD;
    if (perp >= width) continue;
    const f = Math.max(0, along) / len;
    // у стенок струю гасим, иначе она "прилипает" к стеклу и уходит вдоль него
    const cx = (i - 0.5) * CELL, wall = clamp(Math.min(cx, W - cx) / 50, 0, 1);
    const a = 0.4 * (1 - f) * (1 - perp / width) * wall, target = sp * (1 - 0.55 * f), k = IX(i, j);
    u[k] += (n.dx * target - u[k]) * a;
    v[k] += (n.dy * target - v[k]) * a;
  }
}

// Насос набирает воду обратно через сопло — вдоль дна к нему тянет кольца
function suck(side, k) {
  const n = nozzles[side], R = 90, sp = SUCTION * Math.min(1, k * 2);
  const i0 = Math.max(1, Math.floor((n.x - R) / CELL) + 1), i1 = Math.min(NX, Math.floor((n.x + R) / CELL) + 1);
  const j0 = Math.max(1, Math.floor((n.y - R) / CELL) + 1);
  for (let j = j0; j <= NY; j++) for (let i = i0; i <= i1; i++) {
    const rx = n.x - (i - 0.5) * CELL, ry = n.y - (j - 0.5) * CELL, d = Math.hypot(rx, ry);
    if (d >= R || d < 1) continue;
    const a = 0.15 * (1 - d / R), k2 = IX(i, j);
    u[k2] += (rx / d * sp - u[k2]) * a;
    v[k2] += (ry / d * sp - v[k2]) * a;
  }
}

// ---------- Кольца ----------
// Кольцо в профиль = два "сечения обода" (частицы), жёстко связанные на расстоянии D.
// Штырь проходит между ними, только если кольцо достаточно горизонтально и попало точно.
let rings = [];

function makeRing(x, y, ang, D, col, ci) {
  const hx = Math.cos(ang) * D / 2, hy = Math.sin(ang) * D / 2;
  return {
    a: { x: x - hx, y: y - hy, px: x - hx, py: y - hy },
    b: { x: x + hx, y: y + hy, px: x + hx, py: y + hy },
    D, col, dark: shade(col, 0.6), ci, on: -1, shown: -1, tinkT: 0,
    phi: SPIN_REST + (Math.random() < 0.5 ? 0 : Math.PI), om: 0,
    mark: pegs.map(() => false), eng: pegs.map(() => false)
  };
}

function spawnRings(n, D, duo) {
  for (let i = 0; i < n; i++) {
    let x = 0, y = 0;
    for (let tries = 0; tries < 60; tries++) {
      x = D / 2 + RIM + 6 + Math.random() * (W - D - 2 * RIM - 12);
      y = floorY(x) - RIM - 6 - Math.random() * 70;
      const ok = pegs.every(g => Math.abs(x - g.x) > D / 2 + RIM + 6) &&
        rings.every(r => Math.hypot((r.a.x + r.b.x) / 2 - x, (r.a.y + r.b.y) / 2 - y) > D * 0.9);
      if (ok) break;
    }
    const ci = duo ? i % 2 : i % PALETTE.length;
    rings.push(makeRing(x, y, (Math.random() - 0.5) * 0.8, D, duo ? DUO[ci] : PALETTE[ci], ci));
  }
}

function integrateRing(R, dt) {
  let tx = R.b.x - R.a.x, ty = R.b.y - R.a.y;
  const L = Math.hypot(tx, ty) || 1; tx /= L; ty /= L;
  const ePar = Math.exp(-K_PAR * dt), ePerp = Math.exp(-K_PERP * dt);
  const onPeg = R.on >= 0, shelter = onPeg ? PEG_SHELTER : 1, rub = onPeg ? Math.exp(-PEG_FRICTION * dt) : 1;
  const level = (R.a.y - R.b.y) * ALIGN * dt;
  for (let n = 0; n < 2; n++) {
    const p = n ? R.b : R.a;
    let vx = (p.x - p.px) / dt, vy = (p.y - p.py) / dt;
    vy = vy * rub + (n ? level : -level);
    const fu = sample(u, p.x, p.y) * shelter, fv = sample(v, p.x, p.y) * shelter;
    // Сопротивление воды: плашмя кольцо тормозится сильнее, чем ребром — отсюда "планирование"
    const rx = vx - fu, ry = vy - fv, par = rx * tx + ry * ty;
    const ax = par * tx, ay = par * ty;
    vx = fu + ax * ePar + (rx - ax) * ePerp;
    vy = fv + ay * ePar + (ry - ay) * ePerp + G * dt;
    const sp = Math.hypot(vx, vy);
    if (sp > MAXV) { vx *= MAXV / sp; vy *= MAXV / sp; }
    p.px = p.x; p.py = p.y;
    p.x += vx * dt; p.y += vy * dt;
  }
}

// Игра плоская, а игрушка объёмная: стержень штыря держит только "зацепленное" кольцо
// (надетое или заходящее на штырь сверху), остальные проплывают перед ним.
// Верхушка штыря твёрдая для всех — об неё кольца отскакивают.
function collideStatic(p, R) {
  if (p.x < RIM) p.x = RIM; else if (p.x > W - RIM) p.x = W - RIM;
  if (p.y < RIM) p.y = RIM; else if (p.y > H - RIM) p.y = H - RIM;
  for (let i = 1; i < FLOOR.length; i++) {
    const [x0, y0] = FLOOR[i - 1], [x1, y1] = FLOOR[i];
    const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy), nx = dy / L, ny = -dx / L;
    const t = ((p.x - x0) * dx + (p.y - y0) * dy) / (L * L);
    if (t < 0 || t > 1) continue;
    const s = (p.x - x0) * nx + (p.y - y0) * ny;
    if (s < RIM && s > -40) { p.x += nx * (RIM - s); p.y += ny * (RIM - s); p.c = 1; }
  }
  for (let i = 1; i < FLOOR.length - 1; i++) {
    const dx = p.x - FLOOR[i][0], dy = p.y - FLOOR[i][1], d = Math.hypot(dx, dy);
    if (d < RIM && d > 1e-6 && FLOOR[i][1] < FLOOR[i - 1][1]) { p.x += dx / d * (RIM - d); p.y += dy / d * (RIM - d); p.c = 1; }
  }
  const md = RIM + PEG_R;
  for (let k = 0; k < pegs.length; k++) {
    const g = pegs[k];
    if (p.y < g.tip) {
      const dx = p.x - g.x, dy = p.y - g.tip, d2 = dx * dx + dy * dy;
      if (d2 >= md * md) continue;
      const d = Math.sqrt(d2);
      let nx, ny;
      if (d < 1e-6) { nx = p.px < g.x ? -1 : 1; ny = 0; } else { nx = dx / d; ny = dy / d; }
      p.x = g.x + nx * md; p.y = g.tip + ny * md;
    } else if (R.eng[k]) {
      const stop = g.bottom - RIM - 3;
      if (p.y > stop) { p.y = stop; p.c = 1; }
      const dx = p.x - g.x;
      if (Math.abs(dx) >= md) continue;
      const other = p === R.a ? R.b : R.a;
      const side = Math.abs(dx) > 1e-3 ? Math.sign(dx) : (other.x < g.x ? 1 : -1);
      p.x = g.x + side * md;
    }
  }
}

function updateThread(R) {
  const lo = Math.min(R.a.x, R.b.x), hi = Math.max(R.a.x, R.b.x);
  for (let k = 0; k < pegs.length; k++) {
    const g = pegs[k];
    const straddle = lo < g.x - PEG_R && hi > g.x + PEG_R;
    if (R.on === k && R.a.y < g.tip && R.b.y < g.tip) R.on = -1;
    if (R.a.y < g.tip - RIM && R.b.y < g.tip - RIM) R.mark[k] = true;
    else if (!straddle) R.mark[k] = false;
    if (R.on < 0 && straddle && R.mark[k] && R.a.y > g.tip + 1 && R.b.y > g.tip + 1) R.on = k;
    R.eng[k] = R.on === k || (straddle && R.mark[k]);
  }
}

function rimPair(p, q) {
  const dx = q.x - p.x, dy = q.y - p.y, d2 = dx * dx + dy * dy, md = 2 * RIM;
  if (d2 >= md * md || d2 < 1e-8) return;
  const d = Math.sqrt(d2), k = (md - d) / d * 0.5;
  p.x -= dx * k; p.y -= dy * k; q.x += dx * k; q.y += dy * k;
}

function physics(dt) {
  for (const R of rings) integrateRing(R, dt);
  for (let it = 0; it < 4; it++) {
    for (const R of rings) {
      const dx = R.b.x - R.a.x, dy = R.b.y - R.a.y, d = Math.hypot(dx, dy) || 1e-6, k = (d - R.D) / d * 0.5;
      R.a.x += dx * k; R.a.y += dy * k; R.b.x -= dx * k; R.b.y -= dy * k;
    }
    for (const R of rings) { collideStatic(R.a, R); collideStatic(R.b, R); }
    for (let i = 0; i < rings.length; i++) for (let j = i + 1; j < rings.length; j++) {
      const A = rings[i], B = rings[j];
      rimPair(A.a, B.a); rimPair(A.a, B.b); rimPair(A.b, B.a); rimPair(A.b, B.b);
    }
  }
  for (const R of rings) for (let n = 0; n < 2; n++) {
    const p = n ? R.b : R.a;
    if (p.c) { p.px = p.x - (p.x - p.px) * 0.985; p.py = p.y - (p.y - p.py) * 0.985; p.c = 0; }
  }
  for (const R of rings) updateThread(R);
}

function updateSpin(R, dt) {
  const cx = (R.a.x + R.b.x) / 2, cy = (R.a.y + R.b.y) / 2;
  const vx = (R.a.x - R.a.px + R.b.x - R.b.px) / 2, vy = (R.a.y - R.a.py + R.b.y - R.b.py) / 2;
  const speed = Math.hypot(vx, vy) / (STEP / SUB);
  const rel = Math.hypot(vx / (STEP / SUB) - sample(u, cx, cy), vy / (STEP / SUB) - sample(v, cx, cy));
  const target = clamp(-sample(curl, cx, cy) * SPIN_K, -SPIN_MAX, SPIN_MAX);
  R.om += (target - R.om) * (1 - Math.exp(-3 * dt)) + (Math.random() - 0.5) * rel * 0.02;
  if (R.on >= 0 || speed < 25) {
    const d = ((SPIN_REST - R.phi) % Math.PI + Math.PI * 1.5) % Math.PI - Math.PI / 2;
    R.om += d * 40 * dt;
    R.om *= Math.exp(-6 * dt);
  }
  R.om = clamp(R.om, -SPIN_MAX, SPIN_MAX);
  R.phi += R.om * dt;
}

function checkThreads(dt) {
  for (const R of rings) {
    updateSpin(R, dt);
    R.tinkT -= dt;
    if (R.on === R.shown) continue;
    if (R.on >= 0 && state === 'play' && R.tinkT <= 0) {
      const good = mode !== 'colors' || R.on === R.ci;
      tink(good ? 1320 : 330);
      burst((R.a.x + R.b.x) / 2, (R.a.y + R.b.y) / 2, good ? R.col : '#ffffff', 8);
      R.tinkT = 0.6;
    }
    R.shown = R.on;
  }
}

// ---------- Эффекты ----------
const bubbles = [], sparks = [], specks = [];
for (let i = 0; i < 90; i++) specks.push({ x: Math.random() * W, y: Math.random() * H });

function burst(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 90;
    sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, col });
  }
}

function updateFx(dt) {
  for (let s = 0; s < 2; s++) {
    const p = pumps[s], n = nozzles[s];
    p.emit += p.flow * 80 * dt;
    while (p.emit >= 1) {
      p.emit -= 1;
      if (bubbles.length < 320) bubbles.push({
        x: n.x + (Math.random() - 0.5) * 10, y: n.y - 6, r: 1.2 + Math.random() * 3.2,
        vx: n.dx * p.flow * JET * 0.5, vy: n.dy * p.flow * JET * 0.5
      });
    }
  }
  const e = 1 - Math.exp(-5 * dt);
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.vx += (sample(u, b.x, b.y) - b.vx) * e;
    b.vy += (sample(v, b.x, b.y) - 50 - b.r * 10 - b.vy) * e;
    b.x = clamp(b.x + b.vx * dt, b.r, W - b.r);
    b.y += b.vy * dt;
    if (b.y < b.r + 1) bubbles.splice(i, 1);
  }
  for (const s of specks) {
    s.x += sample(u, s.x, s.y) * dt;
    s.y += (sample(v, s.x, s.y) + 4) * dt;
    if (s.x < 2 || s.x > W - 2 || s.y < 2 || s.y > H - 2) { s.x = 4 + Math.random() * (W - 8); s.y = 4 + Math.random() * (H - 8); }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.94; s.vy *= 0.94;
    if (s.life <= 0) sparks.splice(i, 1);
  }
}

// ---------- Звук ----------
let actx = null, noiseGain = null;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
    noiseGain = actx.createGain(); noiseGain.gain.value = 0;
    src.connect(f).connect(noiseGain).connect(actx.destination);
    src.start();
  } catch (e) { actx = null; }
}
function tink(freq) {
  if (!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.22, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.4);
}
function audioUpdate() {
  if (!noiseGain) return;
  const level = state === 'play' ? (pumps[0].flow + pumps[1].flow) * 0.14 : 0;
  noiseGain.gain.setTargetAtTime(level, actx.currentTime, 0.04);
}

// ---------- Режимы и игра ----------
const MODES = {
  classic: { name: 'Классика' },
  colors: { name: 'Два цвета' },
  waves: { name: 'Волны' }
};
let state = 'menu', mode = 'classic', game = null, toastText = '', toastT = 0;

function toast(t) { toastText = t; toastT = 1.8; }

function resetPumps() { for (const p of pumps) Object.assign(p, makePump()); }

function startGame(m) {
  mode = m; initAudio(); resetFluid(); resetPumps();
  rings = []; bubbles.length = 0; sparks.length = 0;
  game = { t: 0, left: 0, score: 0, wave: 1, hold: 0 };
  if (m === 'classic') { spawnRings(8, RING_D, false); toast('Надень все кольца'); }
  else if (m === 'colors') { game.left = 90; spawnRings(8, RING_D - 2, true); toast('Красные — влево, синие — вправо'); }
  else { game.left = 60; spawnWave(); toast('Волна 1'); }
  state = 'play';
  show(null);
}

function spawnWave() {
  const n = Math.min(10, 4 + game.wave), D = Math.max(RING_D - 12, RING_D + 2 - 3 * (game.wave - 1));
  spawnRings(n, D, false);
}

function gameLogic(dt) {
  game.t += dt;
  if (mode === 'classic') {
    game.hold = rings.every(r => r.on >= 0) ? game.hold + dt : 0;
    if (game.hold > 1) {
      const best = getBest('classic'), rec = best == null || game.t < best;
      if (rec) setBest('classic', game.t);
      endGame('Готово!', `Время: ${game.t.toFixed(1)} с`, rec ? 'Новый рекорд!' : `Рекорд: ${best.toFixed(1)} с`);
    }
  } else if (mode === 'colors') {
    game.left -= dt;
    const good = rings.filter(r => r.on === r.ci).length;
    game.hold = good === rings.length ? game.hold + dt : 0;
    if (game.hold > 1) {
      const best = getBest('colors'), rec = best == null || game.left > best;
      if (rec) setBest('colors', game.left);
      endGame('Победа!', `Осталось времени: ${game.left.toFixed(1)} с`, rec ? 'Новый рекорд!' : `Рекорд: ${best.toFixed(1)} с в запасе`);
    } else if (game.left <= 0) {
      game.left = 0;
      endGame('Время вышло', `Правильно надето: ${good} из ${rings.length}`, '');
    }
  } else {
    game.left -= dt;
    game.hold = rings.every(r => r.on >= 0) ? game.hold + dt : 0;
    if (game.hold > 0.6) {
      for (const R of rings) burst((R.a.x + R.b.x) / 2, (R.a.y + R.b.y) / 2, R.col, 6);
      game.score += rings.length;
      game.wave++; game.left += 12; game.hold = 0;
      rings = []; spawnWave(); tink(1760);
      toast(`Волна ${game.wave}  +12 с`);
    } else if (game.left <= 0) {
      game.left = 0;
      const total = game.score + rings.filter(r => r.on >= 0).length;
      const best = getBest('waves'), rec = best == null || total > best;
      if (rec) setBest('waves', total);
      endGame('Время вышло', `Колец надето: ${total} · дошёл до волны ${game.wave}`, rec ? 'Новый рекорд!' : `Рекорд: ${best} колец`);
    }
  }
}

function endGame(title, text, best) {
  state = 'over';
  resetPumps();
  document.getElementById('resTitle').textContent = title;
  document.getElementById('resText').textContent = text;
  document.getElementById('resBest').textContent = best;
  show('result');
}

function getBest(m) { const v = localStorage.getItem('rings_best_' + m); return v == null ? null : +v; }
function setBest(m, v) { try { localStorage.setItem('rings_best_' + m, String(v)); } catch (e) { } }

function refreshBest() {
  const c = getBest('classic'), k = getBest('colors'), w = getBest('waves');
  document.getElementById('best-classic').textContent = c == null ? 'Надень все 8 колец на скорость' : `Рекорд: ${c.toFixed(1)} с`;
  document.getElementById('best-colors').textContent = k == null ? 'Каждый цвет — на свой штырь за 90 с' : `Рекорд: ${k.toFixed(1)} с в запасе`;
  document.getElementById('best-waves').textContent = w == null ? 'Кольца всё меньше, а их всё больше' : `Рекорд: ${w} колец`;
}

let demoT = 1;
function demo(dt) {
  demoT -= dt;
  if (demoT > 0) return;
  const p = pumps[Math.random() < 0.5 ? 0 : 1];
  if (!p.held) { p.held = true; p.base = 0.45 + Math.random() * 0.55; p.auto = 0.2 + Math.random() * 0.5; }
  demoT = 0.6 + Math.random() * 1.6;
}

function tick(dt) {
  if (state === 'menu') demo(dt);
  updatePump(pumps[0], dt); updatePump(pumps[1], dt);
  inject(0); inject(1);
  fluidStep(dt);
  for (let i = 0; i < SUB; i++) physics(dt / SUB);
  checkThreads(dt);
  updateFx(dt);
  if (state === 'play') gameLogic(dt);
  if (toastT > 0) toastT -= dt;
  audioUpdate();
}

// ---------- Экран и управление ----------
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let sw = 0, sh = 0, dpr = 1, S = 1, tankX = 0, tankY = 0, tankW = 0, tankH = 0, hudH = 52;
const PAD = 8;

function layout() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  sw = window.innerWidth; sh = window.innerHeight;
  canvas.width = Math.round(sw * dpr); canvas.height = Math.round(sh * dpr);
  canvas.style.width = sw + 'px'; canvas.style.height = sh + 'px';
  hudH = clamp(sh * 0.07, 48, 64);
  const availW = sw - 2 * PAD, availH = sh - hudH - 2 * PAD;
  S = Math.min(availW / W, availH / H);
  tankW = W * S; tankH = H * S;
  tankX = (sw - tankW) / 2; tankY = hudH + (availH - tankH) / 2 + PAD;
}

// Левая/правая половина экрана; чем выше касание, тем сильнее струя.
// Шкала силы: в портрете — нижняя половина экрана (выше неё — максимум), в ландшафте — вся высота.
function strengthFromY(y) {
  const span = sh > sw ? sh / 2 : sh;
  return 0.18 + 0.82 * clamp((sh - y) / span, 0, 1);
}

function press(side, y, id, strong) {
  const p = pumps[side];
  p.held = true; p.id = id; p.auto = 0; p.boost = 0;
  p.y = p.lastY = y == null ? 0 : y; p.lastT = performance.now();
  p.base = y == null ? (strong ? 1 : 0.65) : strengthFromY(y);
  if (navigator.vibrate) try { navigator.vibrate(6 + Math.round(p.base * 24)); } catch (e) { }
}
function release(side) { pumps[side].held = false; pumps[side].id = null; }

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  if (state !== 'play') return;
  const side = e.clientX < sw / 2 ? 0 : 1;
  press(side, e.clientY, e.pointerId);
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { }
}, { passive: false });

canvas.addEventListener('pointermove', e => {
  for (let s = 0; s < 2; s++) {
    const p = pumps[s];
    if (!p.held || p.id !== e.pointerId) continue;
    const now = performance.now(), vy = (e.clientY - p.lastY) / Math.max(1, now - p.lastT) * 1000;
    if (vy < -400) p.boost = Math.min(0.4, Math.max(p.boost, (-vy - 400) / 2500));
    p.y = p.lastY = e.clientY; p.lastT = now;
    p.base = strengthFromY(e.clientY);
  }
});
const endPointer = e => { for (let s = 0; s < 2; s++) if (pumps[s].id === e.pointerId) release(s); };
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('lostpointercapture', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

const KEYS = { KeyA: 0, ArrowLeft: 0, KeyL: 1, ArrowRight: 1 };
window.addEventListener('keydown', e => {
  if (e.code === 'Escape' || e.code === 'KeyP') { if (state === 'play') pauseGame(); else if (state === 'pause') resumeGame(); return; }
  const s = KEYS[e.code];
  if (s === undefined || e.repeat || state !== 'play') return;
  initAudio();
  press(s, null, 'key', e.shiftKey);
});
window.addEventListener('keyup', e => { const s = KEYS[e.code]; if (s !== undefined && pumps[s].id === 'key') release(s); });

// ---------- Меню ----------
const overlays = { menu: document.getElementById('menu'), pause: document.getElementById('pause'), result: document.getElementById('result') };
const pauseBtn = document.getElementById('pauseBtn');
function show(name) {
  for (const k in overlays) overlays[k].classList.toggle('hidden', k !== name);
  pauseBtn.classList.toggle('hidden', state !== 'play');
  if (name === 'menu') refreshBest();
}
function pauseGame() { if (state !== 'play') return; state = 'pause'; resetPumps(); show('pause'); }
function resumeGame() { state = 'play'; show(null); }
function toMenu() { state = 'menu'; resetFluid(); resetPumps(); rings = []; spawnRings(8, RING_D, false); show('menu'); }

document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => startGame(b.dataset.mode)));
document.querySelectorAll('.toMenu').forEach(b => b.addEventListener('click', toMenu));
document.getElementById('resumeBtn').addEventListener('click', resumeGame);
document.getElementById('restartBtn').addEventListener('click', () => startGame(mode));
document.getElementById('againBtn').addEventListener('click', () => startGame(mode));
pauseBtn.addEventListener('click', pauseGame);
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

// ---------- Отрисовка ----------
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawRing(R, front) {
  const a = R.a, b = R.b, cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
  let ang = Math.atan2(b.y - a.y, b.x - a.x);
  if (Math.cos(ang) < 0) ang += Math.PI;
  const s = Math.sin(R.phi), rx = R.D / 2, ry = rx * Math.max(0.07, Math.abs(s));
  const a0 = (front ? 0 : Math.PI) + (s < 0 ? Math.PI : 0);
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, ang, a0, a0 + Math.PI);
  ctx.lineWidth = RIM * 2; ctx.strokeStyle = front ? R.col : R.dark; ctx.stroke();
  if (front) {
    const sg = s < 0 ? -1 : 1, ox = Math.sin(ang) * RIM * 0.4 * sg, oy = -Math.cos(ang) * RIM * 0.4 * sg;
    ctx.beginPath();
    ctx.ellipse(cx + ox, cy + oy, rx, ry, ang, a0 + 0.35, a0 + Math.PI - 0.35);
    ctx.lineWidth = RIM * 0.7; ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.stroke();
  }
}

function render(now) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const bg = ctx.createLinearGradient(0, 0, 0, sh);
  bg.addColorStop(0, '#ff6b5b'); bg.addColorStop(1, '#b52a28');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, sw, sh);

  // аквариум
  ctx.save();
  ctx.translate(tankX, tankY); ctx.scale(S, S);
  rr(0, 0, W, H, 18); ctx.clip();
  const wg = ctx.createLinearGradient(0, 0, 0, H);
  wg.addColorStop(0, '#8fe0ff'); wg.addColorStop(1, '#1d6fd6');
  ctx.fillStyle = wg; ctx.fillRect(0, 0, W, H);

  const tm = now / 1000;
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  for (let i = 0; i < 3; i++) {
    const x0 = 40 + i * 120 + Math.sin(tm * 0.4 + i * 2) * 30;
    ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0 + 40, 0); ctx.lineTo(x0 - 60, H); ctx.lineTo(x0 - 130, H); ctx.closePath(); ctx.fill();
  }

  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  for (const s of specks) ctx.fillRect(s.x - 0.8, s.y - 0.8, 1.6, 1.6);

  ctx.beginPath(); ctx.moveTo(0, H);
  for (const [x, y] of FLOOR) ctx.lineTo(x, y);
  ctx.lineTo(W, H); ctx.closePath();
  const fg = ctx.createLinearGradient(0, H - 60, 0, H);
  fg.addColorStop(0, '#f4f7fb'); fg.addColorStop(1, '#b9c6d8');
  ctx.fillStyle = fg; ctx.fill();

  for (const g of pegs) {
    const fy = floorY(g.x);
    ctx.fillStyle = 'rgba(20,50,100,0.35)'; rr(g.x - 5, g.bottom, 10, fy - g.bottom + 4, 3); ctx.fill();
  }

  ctx.lineCap = 'butt';
  const onPeg = R => R.on >= 0 || R.eng[0] || R.eng[1];
  for (const R of rings) if (onPeg(R)) drawRing(R, false);

  for (let k = 0; k < pegs.length; k++) {
    const g = pegs[k];
    const pg = ctx.createLinearGradient(g.x - PEG_R, 0, g.x + PEG_R, 0);
    pg.addColorStop(0, '#8d9bb0'); pg.addColorStop(0.4, '#ffffff'); pg.addColorStop(1, '#7a879b');
    ctx.fillStyle = pg; rr(g.x - PEG_R, g.tip - PEG_R, PEG_R * 2, g.bottom - g.tip + PEG_R, PEG_R); ctx.fill();
    ctx.fillStyle = '#dfe6ef'; rr(g.x - 16, g.bottom - 3, 32, 7, 3.5); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.15)'; rr(g.x - 16, g.bottom + 1, 32, 3, 1.5); ctx.fill();
    if (mode === 'colors' && state !== 'menu') {
      ctx.beginPath(); ctx.arc(g.x, g.tip, PEG_R + 2.5, 0, Math.PI * 2); ctx.fillStyle = DUO[k]; ctx.fill();
    }
  }

  for (const R of rings) {
    if (!onPeg(R)) drawRing(R, false);
    drawRing(R, true);
  }

  for (const n of nozzles) {
    ctx.save(); ctx.translate(n.x, n.y); ctx.rotate(Math.atan2(n.dy, n.dx) + Math.PI / 2);
    ctx.fillStyle = '#2b3a55'; rr(-8, -4, 16, 16, 4); ctx.fill();
    ctx.fillStyle = '#111a2b'; rr(-4, -6, 8, 6, 2); ctx.fill();
    ctx.restore();
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1;
  for (const b of bubbles) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke(); }

  for (const s of sparks) {
    ctx.globalAlpha = Math.max(0, s.life / 0.6);
    ctx.fillStyle = s.col; ctx.beginPath(); ctx.arc(s.x, s.y, 2.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = 'rgba(255,255,255,0.13)'; rr(10, 14, 10, H - 28, 5); ctx.fill();
  ctx.restore();

  rr(tankX - 4, tankY - 4, tankW + 8, tankH + 8, 18 * S + 4);
  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.stroke();

  if (state === 'play' || state === 'pause') drawHud();

  if (toastT > 0 && state === 'play') {
    ctx.globalAlpha = Math.min(1, toastT / 0.4);
    ctx.font = `800 ${Math.round(clamp(tankW * 0.075, 18, 30))}px system-ui`; ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,40,90,0.6)'; ctx.fillStyle = '#fff';
    ctx.strokeText(toastText, sw / 2, tankY + tankH * 0.3); ctx.fillText(toastText, sw / 2, tankY + tankH * 0.3);
    ctx.globalAlpha = 1;
  }
}

function drawHud() {
  const y = hudH / 2 + 6;
  ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
  ctx.font = '600 15px system-ui'; ctx.textAlign = 'left';
  ctx.fillText(mode === 'waves' ? `Волна ${game.wave}` : MODES[mode].name, Math.max(PAD, tankX), y);
  let score;
  if (mode === 'colors') score = `${rings.filter(r => r.on === r.ci).length}/${rings.length}`;
  else if (mode === 'waves') score = `${game.score + rings.filter(r => r.on >= 0).length}`;
  else score = `${rings.filter(r => r.on >= 0).length}/${rings.length}`;
  ctx.textAlign = 'right';
  ctx.fillText(score, Math.min(sw - 60, tankX + tankW), y);
  ctx.font = '800 26px system-ui'; ctx.textAlign = 'center';
  const t = mode === 'classic' ? game.t.toFixed(1) : `${Math.floor(Math.ceil(game.left) / 60)}:${String(Math.ceil(game.left) % 60).padStart(2, '0')}`;
  if (mode !== 'classic' && game.left < 10) ctx.fillStyle = '#ffe14d';
  ctx.fillText(t, sw / 2, y);
  ctx.textBaseline = 'alphabetic';
}

// ---------- Цикл ----------
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  if (state !== 'pause') {
    acc += dt;
    while (acc >= STEP) { tick(STEP); acc -= STEP; }
  }
  render(now);
  requestAnimationFrame(frame);
}

window.addEventListener('resize', layout);
layout();
spawnRings(8, RING_D, false);
show('menu');
requestAnimationFrame(frame);
</script>
