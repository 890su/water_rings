<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#c2302e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Кольца — водная игра</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#c2302e;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
  canvas{display:block;touch-action:none}
  /* Игровой кадр: если браузер сам повернул экран, кадр поворачиваем обратно — низ игры привязан к корпусу */
  #root{position:fixed;left:0;top:0;overflow:hidden;transform-origin:0 0}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    justify-content:safe center;overflow-y:auto;touch-action:pan-y;
    gap:10px;background:rgba(10,20,40,.62);text-align:center;padding:24px;box-sizing:border-box;
    padding-left:calc(24px + var(--safe-l,0px));padding-right:calc(24px + var(--safe-r,0px))}
  .hidden{display:none!important}
  h1{margin:0;font-size:40px;letter-spacing:1px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
  p{margin:0;max-width:340px;line-height:1.4;opacity:.92}
  .intro{max-width:760px;font-size:21px;font-weight:600;line-height:1.4;opacity:1;text-shadow:0 2px 5px rgba(0,0,0,.5)}
  .sub{opacity:.75;margin-bottom:6px}
  .small{font-size:13px;opacity:.75;min-height:16px}
  button{font:inherit;font-size:19px;font-weight:700;color:#fff;border:0;border-radius:16px;padding:14px 22px;
    min-width:250px;background:linear-gradient(#3b8cff,#1a5fd0);box-shadow:0 5px 0 #0d3a85;cursor:pointer}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #0d3a85}
  button.alt{background:linear-gradient(#ff6b8a,#d8264d);box-shadow:0 5px 0 #8a0d27}
  button.green{background:linear-gradient(#3fd68f,#16a35f);box-shadow:0 5px 0 #0b6b3c}
  button.ghost{background:rgba(255,255,255,.14);box-shadow:none}
  .soundOpts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .soundOpts button{min-width:0;padding:9px 13px;font-size:14px}
  #pauseBtn{position:fixed;top:4px;left:50%;min-width:0;width:44px;height:44px;padding:0;font-size:16px;
    border-radius:12px;background:rgba(0,0,0,.22);box-shadow:none}
  .modes,.opts{display:flex;flex-direction:column;align-items:center;gap:10px}
  .mode{display:flex;flex-direction:column;align-items:center;gap:4px}
  /* Низкий кадр (альбомный телефон): режимы и настройки в ряд, без длинного абзаца — меню влезает без прокрутки */
  #root.short .overlay{gap:6px;padding:10px 16px}
  #root.short h1{font-size:30px}
  #root.short .keys,#root.short .sub{display:none}
  #root.short .intro{font-size:18px;line-height:1.3;max-width:740px}
  #root.short .modes,#root.short .opts{flex-direction:row;flex-wrap:wrap;justify-content:center}
  #root.short .modes button{min-width:150px;padding:12px 16px}
  #root.short .opts button,#root.short .overlay>button{min-width:0;font-size:16px;padding:10px 18px}
  #root.short .overlay>button{min-width:220px}
</style>
</head>
<body>
<div id="root">
<canvas id="c"></canvas>
<button id="pauseBtn" class="hidden" aria-label="Пауза">II</button>

<div id="menu" class="overlay">
  <h1>Кольца</h1>
  <p class="sub">Водная игра из детства</p>
  <p class="intro">Жми слева или справа. Чем выше касание — тем сильнее струя. Резкий свайп вверх — сильный толчок. Насос выдыхается: отпусти, чтобы он снова набрал воду.</p>
  <div class="modes">
    <div class="mode"><button data-mode="classic">Классика</button><div class="small" id="best-classic"></div></div>
    <div class="mode"><button data-mode="colors" class="alt">Два цвета</button><div class="small" id="best-colors"></div></div>
    <div class="mode"><button data-mode="waves" class="green">Волны</button><div class="small" id="best-waves"></div></div>
  </div>
  <div class="opts">
    <button id="tiltBtn" class="ghost hidden"></button>
    <button id="howBtn" class="ghost">Как играть</button>
  </div>
  <div class="soundOpts">
    <button class="ghost musicBtn" aria-pressed="true">Музыка: вкл</button>
    <button class="ghost sfxBtn" aria-pressed="true">Звуки: вкл</button>
  </div>
  <p class="small keys">На компьютере: A / L или стрелки, с Shift — сильнее; Q / E — наклон, пробел — встряска</p>
</div>

<div id="pause" class="overlay hidden">
  <h1>Пауза</h1>
  <button id="resumeBtn">Продолжить</button>
  <button id="restartBtn" class="ghost">Заново</button>
  <div class="soundOpts">
    <button class="ghost musicBtn" aria-pressed="true">Музыка: вкл</button>
    <button class="ghost sfxBtn" aria-pressed="true">Звуки: вкл</button>
  </div>
  <button class="ghost toMenu">В меню</button>
</div>

<div id="result" class="overlay hidden">
  <h1 id="resTitle"></h1>
  <p id="resText"></p>
  <p class="small" id="resBest"></p>
  <div style="height:6px"></div>
  <button id="againBtn">Ещё раз</button>
  <button class="ghost toMenu">В меню</button>
</div>
</div>

<script>/*@GAME@*/</script>
</body>
</html>
